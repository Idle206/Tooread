             <!-- FORM SECTION -->
<div id="createFormSection" class="d-none">

    <div class="container bg-white p-4 shadow-sm rounded" style="max-width: 800px;">

        <form id="addStoryForm">

            <!-- COVER IMAGE (URL or PATH) -->
            <div class="mb-3 row">
                <label class="col-sm-3 col-form-label">
                    Cover Image
                </label>

                <div class="col-sm-9">
                    <input type="text"
                           id="formCover"
                           class="form-control"
                           placeholder="Image URL or path (e.g. images/a.jpg)"
                           required>

                    <div class="form-text">
                        JSON Server không upload file, chỉ dùng URL hoặc path
                    </div>
                </div>
            </div>

            <!-- TITLE -->
            <div class="mb-3 row">
                <label class="col-sm-3 col-form-label">
                    Title
                </label>

                <div class="col-sm-9">
                    <input type="text"
                           id="formTitle"
                           class="form-control"
                           required>
                </div>
            </div>

            <!-- AUTHOR -->
            <div class="mb-3 row">
                <label class="col-sm-3 col-form-label">
                    Author
                </label>

                <div class="col-sm-9">
                    <input type="text"
                           id="formAuthor"
                           class="form-control"
                           required>
                </div>
            </div>

            <!-- GENRE -->
            <div class="mb-3 row">
                <label class="col-sm-3 col-form-label">
                    Genre
                </label>

                <div class="col-sm-9">
                    <input type="text"
                           id="formGenre"
                           class="form-control"
                           placeholder="Romance, Fantasy, Action..."
                           required>
                </div>
            </div>

            <div class="mb-3 row">
                <label class="col-sm-3 col-form-label">
                    Schedule
                </label>

                <div class="col-sm-9">
                    <input type="text"
                           id="formSchedule"
                           class="form-control"
                           placeholder="Every Tuesday, Weekly, Updating...">
                </div>
            </div>

            <div class="mb-3 row">
                <label class="col-sm-3 col-form-label">
                    Description
                </label>

                <div class="col-sm-9">
                    <textarea id="formDescription"
                              class="form-control"
                              rows="5"
                              placeholder="Story description"></textarea>
                </div>
            </div>

            <!-- SUBMIT -->
            <div class="row">
                <div class="col-sm-9 offset-sm-3">
                    <button type="submit" class="btn btn-primary px-4">
                        Create
                    </button>
                </div>
            </div>

        </form>

    </div>

</div>

<div id="chapterFormSection" class="d-none">

    <div class="container bg-white p-4 shadow-sm rounded" style="max-width: 800px;">

        <form id="addChapterForm">

            <div class="mb-3 row">
                <label class="col-sm-3 col-form-label">
                    Series
                </label>

                <div class="col-sm-9">
                    <select id="chapterStoryId" class="form-select" required></select>
                </div>
            </div>

            <div class="mb-3 row">
                <label class="col-sm-3 col-form-label">
                    Volume
                </label>

                <div class="col-sm-9">
                    <input type="text"
                           id="chapterVolumeTitle"
                           class="form-control"
                           placeholder="Tap 1, Volume 1..."
                           required>
                </div>
            </div>

            <div class="mb-3 row">
                <label class="col-sm-3 col-form-label">
                    Chapter title
                </label>

                <div class="col-sm-9">
                    <input type="text"
                           id="chapterTitle"
                           class="form-control"
                           placeholder="Chapter 1"
                           required>
                </div>
            </div>

            <div class="mb-3 row">
                <label class="col-sm-3 col-form-label">
                    Chapter number
                </label>

                <div class="col-sm-9">
                    <input type="number"
                           id="chapterNumber"
                           class="form-control"
                           min="1"
                           value="1"
                           required>
                </div>
            </div>

            <div class="mb-3 row">
                <label class="col-sm-3 col-form-label">
                    Release date
                </label>

                <div class="col-sm-9">
                    <input type="date"
                           id="chapterReleaseDate"
                           class="form-control">
                </div>
            </div>

            <div class="mb-3 row">
                <label class="col-sm-3 col-form-label">
                    Content
                </label>

                <div class="col-sm-9">
                    <textarea id="chapterContent"
                              class="form-control"
                              rows="10"
                              placeholder="Paste chapter content here"
                              required></textarea>
                </div>
            </div>

            <div class="row">
                <div class="col-sm-9 offset-sm-3 d-flex gap-2">
                    <button type="submit" class="btn btn-primary px-4">
                        Add chapter
                    </button>
                    <button type="button" id="backToSeriesBtn" class="btn btn-outline-secondary px-4">
                        Back
                    </button>
                </div>
            </div>

        </form>

    </div>
